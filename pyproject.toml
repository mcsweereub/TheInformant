[project]
name = "informant"
version = "0.1.0"
description = "Research UK companies into structured JSON profiles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
informant = "informant.cli:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
