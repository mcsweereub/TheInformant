[project]
name = "informant"
version = "0.1.0"
description = "Research UK companies into structured JSON profiles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "beautifulsoup4>=4.15.0",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
informant = "informant.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, bugbear, import order, pyupgrade
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",  # long lines: readability is judged by hand
    "E741",  # short names like `l` in small comprehensions
    "B008",  # typer declares options as function-call defaults
]
